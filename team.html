    <main>
      <div class="wrap">
        <h1 class="page-title">The Team</h1>
        <p>
          The small team of volunteers working on Dealt in Darkness. Select a name to see their role and
          their work.
        </p>
        <div id="team"></div>
      </div>
      <dialog id="dlg" aria-labelledby="d-name">
        <div class="dhead">
          <div>
            <h2 id="d-name"></h2>
            <p class="role" id="d-role"></p>
          </div>
          <button class="btn" id="close" aria-label="Close">Close</button>
        </div>
        <div id="d-bio-section">
          <h3>Bio</h3>
          <p id="d-bio"></p>
        </div>
        <div id="d-contributions-section">
          <h3>Contributions</h3>
          <ul id="d-contributions" class="contributions"></ul>
        </div>
        <div id="d-links"></div>
        <div id="gal">
          <div id="stage"></div>
          <div class="gnav">
            <button class="btn" id="prev" aria-label="Previous">←</button>
            <span id="cap" aria-live="polite"></span>
            <button class="btn" id="next" aria-label="Next">→</button>
          </div>
          <div id="thumbs"></div>
        </div>
        <p id="empty" class="note" hidden></p>
      </dialog>
      <script src="team-data.js"></script>
